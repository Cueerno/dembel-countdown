<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отсчет до дембеля</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .badge-home {
            display: inline-block;
            background: rgba(234, 179, 8, 0.15);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            word-break: break-word;
            line-height: 1.3;
        }

        .subtext {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
        }

        button.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="home-badge" class="badge-home" style="display: none;">Еще дома</div>
    <h1>До дембеля осталось</h1>
    <div id="counter" class="status">Загрузка...</div>

    <div class="controls">
        <button onclick="setFormat('full')" id="btn-full" class="active">Г : М : Д : Мн : Ск</button>
        <button onclick="setFormat('ymd')" id="btn-ymd">Месяцы + Дни</button>
        <button onclick="setFormat('days')" id="btn-days">Только Дни</button>
        <button onclick="setFormat('short')" id="btn-short">М : Д : Мин</button>
    </div>

    <div class="subtext">Дата дембеля (предположительная): 28.10.2027</div>
</div>

<script>
    // Целевые даты
    const targetDate = new Date(2027, 9, 28, 0, 0, 0);
    const checkDate = new Date(2026, 9, 28, 0, 0, 0);

    // Текущий выбранный формат (по умолчанию полный)
    let currentFormat = 'full';

    function setFormat(format) {
        currentFormat = format;
        // Переключаем активный класс на кнопках
        document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${format}`).classList.add('active');
        updateCounter();
    }

    function getPlural(number, one, two, five) {
        let n = Math.abs(number);
        n %= 100;
        if (n >= 5 && n <= 20) return five;
        n %= 10;
        if (n === 1) return one;
        if (n >= 2 && n <= 4) return two;
        return five;
    }

    function updateCounter() {
        const now = new Date();
        const counterElement = document.getElementById('counter');
        const homeBadge = document.getElementById('home-badge');

        // Показываем плашку "Еще дома", если дата меньше 28.10.2026
        if (now < checkDate) {
            homeBadge.style.display = 'inline-block';
        } else {
            homeBadge.style.display = 'none';
        }

        if (now >= targetDate) {
            counterElement.textContent = "Дембель!";
            counterElement.style.color = "#4ade80";
            return;
        }

        const totalMs = targetDate - now;

        // 1. Формат: Только Дни
        if (currentFormat === 'days') {
            const days = Math.floor(totalMs / (1000 * 60 * 60 * 24));
            counterElement.textContent = `${days} ${getPlural(days, 'день', 'дня', 'дней')}`;
            return;
        }

        // Вычисления для развернутых форматов через встроенный календарь (учитывает високосные года и разную длину месяцев)
        let years = targetDate.getFullYear() - now.getFullYear();
        let months = targetDate.getMonth() - now.getMonth();
        let days = targetDate.getDate() - now.getDate();
        let hours = targetDate.getHours() - now.getHours();
        let minutes = targetDate.getMinutes() - now.getMinutes();
        let seconds = targetDate.getSeconds() - now.getSeconds();

        if (seconds < 0) { minutes--; seconds += 60; }
        if (minutes < 0) { hours--; minutes += 60; }
        if (hours < 0) { days--; hours += 24; }
        if (days < 0) {
            months--;
            // Берем количество дней в предыдущем месяце целевой даты
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) { years--; months += 12; }

        // 2. Формат: Год : Месяц : День : Минута : Секунда (Полный)
        if (currentFormat === 'full') {
            let res = [];
            if (years > 0) res.push(`${years} ${getPlural(years, 'г', 'г', 'лет')}`);
            if (months > 0 || years > 0) res.push(`${months} ${getPlural(months, 'мес', 'мес', 'мес')}`);
            res.push(`${days} ${getPlural(days, 'дн', 'дн', 'дн')}`);
            res.push(`${minutes} ${getPlural(minutes, 'мин', 'мин', 'мин')}`);
            res.push(`${seconds} ${getPlural(seconds, 'сек', 'сек', 'сек')}`);
            counterElement.textContent = res.join(' : ');
            return;
        }

        // 3. Формат: Месяцы + Дни
        if (currentFormat === 'ymd') {
            let totalMonths = (years * 12) + months;
            let res = [];
            if (totalMonths > 0) res.push(`${totalMonths} ${getPlural(totalMonths, 'месяц', 'месяца', 'месяцев')}`);
            res.push(`${days} ${getPlural(days, 'день', 'дня', 'дней')}`);
            counterElement.textContent = res.join(' и ');
            return;
        }

        // 4. Формат: Месяц : День : Минута (отрезая наименьшее / без секунд и часов)
        if (currentFormat === 'short') {
            let totalMonths = (years * 12) + months;
            let res = [];
            if (totalMonths > 0) res.push(`${totalMonths} мес`);
            res.push(`${days} дн`);
            res.push(`${minutes} мин`);
            counterElement.textContent = res.join(' : ');
            return;
        }
    }

    // Обновление каждую секунду для плавного тикания
    setInterval(updateCounter, 1000);
    updateCounter();
</script>
</body>
</html>
