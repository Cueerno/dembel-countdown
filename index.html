<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отсчет до ДМБ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #a0aec0;
            text-transform: uppercase;
        }

        .status {
            font-size: 3rem;
            font-weight: 700;
            color: #4facfe;
            text-shadow: 0 2px 10px rgba(79, 172, 254, 0.3);
            margin-bottom: 10px;
        }

        .subtext {
            font-size: 1rem;
            color: #718096;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>До дембеля осталось</h1>
    <div id="counter" class="status">Загрузка...</div>
    <div class="subtext">Дата дембеля (предположительная): 28.10.2027</div>
</div>

<script>
    function updateCounter() {
        const now = new Date();

        // Целевые даты (Месяцы в JS начинаются с 0, поэтому октябрь - это 9)
        const targetDate = new Date(2027, 9, 28);
        const checkDate = new Date(2026, 9, 28);

        const counterElement = document.getElementById('counter');

        // Условие 1: Если текущая дата раньше, чем 28.10.2026
        if (now < checkDate) {
            counterElement.textContent = "еще не началось";
            return;
        }

        // Условие 2: Считаем разницу до дембеля
        const timeDiff = targetDate - now;

        if (timeDiff <= 0) {
            counterElement.textContent = "Дембель!";
            counterElement.style.color = "#00e676"; // Зеленый цвет для праздника
            return;
        }

        // Переводим миллисекунды в дни (округляем в большую сторону, чтобы показывался текущий начавшийся день)
        const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

        // Склонение слова "день"
        let dayWord = "дней";
        const lastDigit = daysLeft % 10;
        const lastTwoDigits = daysLeft % 100;

        if (lastDigit === 1 && lastTwoDigits !== 11) {
            dayWord = "день";
        } else if ([2, 3, 4].includes(lastDigit) && ![12, 13, 14].includes(lastTwoDigits)) {
            dayWord = "дня";
        }

        counterElement.textContent = `${daysLeft} ${dayWord}`;
    }

    // Запускаем расчет сразу при загрузке страницы
    updateCounter();

    // Обновляем раз в час на случай, если страница открыта долго
    setInterval(updateCounter, 3600000);
</script>
</body>
</html>
