<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Отсчет до дембеля</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg1: #0b1730;
            --bg2: #1e3a5f;
            --accent: #7dd3fc;
            --gap: 20px;
        }

        body.winter {
            --bg1: #0b1730;
            --bg2: #25507a;
            --accent: #7dd3fc;
        }

        body.spring {
            --bg1: #1c3b33;
            --bg2: #4f8a68;
            --accent: #f9a8d4;
        }

        body.summer {
            --bg1: #0284c7;
            --bg2: #fbbf24;
            --accent: #fde047;
        }

        body.autumn {
            --bg1: #2e1508;
            --bg2: #b45309;
            --accent: #fdba74;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(160deg, var(--bg1), var(--bg2));
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 16px;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(860px, 100%);
            height: 680px;
            max-height: 100%;
            padding: 24px 28px;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* ---------- Вкладки ---------- */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 300px;
            padding: 4px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            height: 34px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: #94a3b8;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .tab:hover {
            color: #f8fafc;
        }

        .tab.active {
            background: var(--accent);
            color: #0f172a;
        }

        /* ---------- Области вкладок ---------- */
        .views {
            flex: 1;
            width: 100%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
        }

        .view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
        }

        .view.active {
            display: flex;
        }

        #view-counter {
            gap: var(--gap);
        }

        #view-days {
            gap: 12px;
            justify-content: flex-start;
            overflow: hidden;
        }

        /* ---------- Счетчик ---------- */
        h1 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .badge-home {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            visibility: hidden;
        }

        .badge-home.show {
            visibility: visible;
        }

        .counter {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .unit {
            flex: 1 1 0;
            min-width: 0;
            max-width: 110px;
            padding: 18px 0 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .unit .num {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .unit .lbl {
            margin-top: 8px;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .unit.done {
            flex: 0 1 auto;
            width: 100%;
            max-width: 300px;
            padding: 24px 0;
        }

        .unit.done .num {
            font-size: 2.8rem;
            color: #4ade80;
        }

        .subtext {
            width: 100%;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: var(--gap);
        }

        /* ---------- Вкладка «Дни» ---------- */
        .days-progress {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-size: 0.82rem;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .days-progress b {
            color: var(--accent);
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
        }

        .bar {
            width: 100%;
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
            flex-shrink: 0;
        }

        .bar > div {
            height: 100%;
            width: 0;
            border-radius: 6px;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            transition: width 0.6s ease;
        }

        .days-wrap {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 0;
            display: flex;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }

        .days-grid {
            display: grid;
            gap: 3px;
            margin: auto;
        }

        .dcell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.09);
            color: #e2e8f0;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            user-select: none;
            -webkit-user-select: none;
        }

        .dcell.passed {
            background: rgba(255, 255, 255, 0.03);
            color: #64748b;
            font-weight: 500;
        }

        .dcell.passed::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.85;
            background:
                    linear-gradient(to top right, transparent calc(50% - 0.75px), var(--accent) calc(50% - 0.75px), var(--accent) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
                    linear-gradient(to bottom right, transparent calc(50% - 0.75px), var(--accent) calc(50% - 0.75px), var(--accent) calc(50% + 0.75px), transparent calc(50% + 0.75px));
        }

        .dcell.today {
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25), 0 0 14px var(--accent);
        }

        .days-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 18px;
            font-size: 0.72rem;
            color: #94a3b8;
            flex-shrink: 0;
        }

        .days-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .days-legend i {
            display: block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .lg-passed {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-image:
                    linear-gradient(to top right, transparent calc(50% - 0.75px), var(--accent) calc(50% - 0.75px), var(--accent) calc(50% + 0.75px), transparent calc(50% + 0.75px)),
                    linear-gradient(to bottom right, transparent calc(50% - 0.75px), var(--accent) calc(50% - 0.75px), var(--accent) calc(50% + 0.75px), transparent calc(50% + 0.75px));
        }

        .lg-today {
            background: var(--accent);
        }

        .lg-future {
            background: rgba(255, 255, 255, 0.09);
        }

        /* ---------- Мобильные и планшеты ---------- */
        @media (max-width: 700px) {
            body {
                padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            }

            .container {
                height: min(100%, 600px);
                padding: 16px 12px;
                gap: 12px;
                border-radius: 22px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }

            .tabs {
                max-width: none;
            }

            .tab {
                height: 40px;
                font-size: 0.9rem;
            }

            #view-counter {
                gap: 16px;
            }

            h1 {
                font-size: 0.9rem;
                letter-spacing: 1.2px;
            }

            .badge-home {
                height: 28px;
                padding: 0 12px;
                font-size: 0.66rem;
                letter-spacing: 1px;
            }

            .counter {
                gap: 8px;
            }

            .unit {
                padding: 14px 0 10px;
                border-radius: 16px;
            }

            .unit .num {
                font-size: 2rem;
            }

            .unit .lbl {
                margin-top: 6px;
                font-size: 0.62rem;
                letter-spacing: 0.3px;
            }

            .unit.done .num {
                font-size: 2.2rem;
            }

            .subtext {
                font-size: 0.78rem;
                padding-top: 16px;
            }

            .days-progress {
                font-size: 0.74rem;
            }

            .days-progress b {
                font-size: 0.95rem;
            }
        }

        /* Узкие телефоны: счетчик в два ряда (3 + 2) */
        @media (max-width: 480px) {
            .counter {
                flex-wrap: wrap;
            }

            .unit {
                flex: 0 0 calc((100% - 16px) / 3);
                max-width: none;
            }

            .unit .num {
                font-size: 2.2rem;
            }

            .unit .lbl {
                font-size: 0.66rem;
            }

            .unit.done {
                flex: 0 1 auto;
            }
        }
    </style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="container">
    <div class="tabs">
        <button class="tab active" id="tab-counter" onclick="setView('counter')">Счётчик</button>
        <button class="tab" id="tab-days" onclick="setView('days')">Дни</button>
    </div>

    <div class="views">
        <!-- Вкладка: счётчик -->
        <div class="view active" id="view-counter">
            <div id="home-badge" class="badge-home">Служба еще не началась</div>
            <h1>До дембеля осталось</h1>

            <div id="counter" class="counter"></div>

            <div class="subtext">Дата дембеля (предположительная): 28.10.2027</div>
        </div>

        <!-- Вкладка: дни (365 → 1) -->
        <div class="view" id="view-days">
            <div class="days-progress">
                <span>Пройдено дней</span>
                <span><b id="days-done">0</b> из 365 · осталось <b id="days-left">365</b></span>
            </div>
            <div class="bar"><div id="days-bar-fill"></div></div>

            <div class="days-wrap" id="days-wrap">
                <div class="days-grid" id="days-grid"></div>
            </div>

            <div class="days-legend">
                <span><i class="lg-passed"></i>пройден</span>
                <span><i class="lg-today"></i>сегодня</span>
                <span><i class="lg-future"></i>впереди</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ?season=winter|spring|summer|autumn — проверка сезона
    // ?date=2027-03-15 — проверка на любую дату
    const params = new URLSearchParams(location.search);

    function getNow() {
        const forcedDate = params.get('date');
        if (forcedDate) {
            const d = new Date(forcedDate + 'T12:00:00');
            if (!isNaN(d)) return d;
        }
        return new Date();
    }

    // ================== ВКЛАДКИ ==================
    function setView(name) {
        ['counter', 'days'].forEach(v => {
            document.getElementById('view-' + v).classList.toggle('active', v === name);
            document.getElementById('tab-' + v).classList.toggle('active', v === name);
        });

        if (name === 'days') {
            requestAnimationFrame(() => {
                fitDays();
                scrollToToday();
            });
        }
    }

    // ================== СЧЕТЧИК ==================
    const targetDate = new Date(2027, 9, 28, 0, 0, 0);
    const checkDate = new Date(2026, 9, 28, 0, 0, 0);
    const TOTAL_DAYS = 365;

    function getPlural(number, one, two, five) {
        let n = Math.abs(number);
        n %= 100;
        if (n >= 5 && n <= 20) return five;
        n %= 10;
        if (n === 1) return one;
        if (n >= 2 && n <= 4) return two;
        return five;
    }

    function render(units) {
        document.getElementById('counter').innerHTML = units.map(u =>
            `<div class="unit"><div class="num">${u.value}</div><div class="lbl">${u.label}</div></div>`
        ).join('');
    }

    function updateCounter() {
        const now = getNow();
        document.getElementById('home-badge').classList.toggle('show', now < checkDate);

        updateDays(now);

        if (now >= targetDate) {
            document.getElementById('counter').innerHTML =
                `<div class="unit done"><div class="num">Дембель!</div></div>`;
            return;
        }

        let years = targetDate.getFullYear() - now.getFullYear();
        let months = targetDate.getMonth() - now.getMonth();
        let days = targetDate.getDate() - now.getDate();
        let hours = targetDate.getHours() - now.getHours();
        let minutes = targetDate.getMinutes() - now.getMinutes();
        let seconds = targetDate.getSeconds() - now.getSeconds();

        if (seconds < 0) {
            minutes--;
            seconds += 60;
        }
        if (minutes < 0) {
            hours--;
            minutes += 60;
        }
        if (hours < 0) {
            days--;
            hours += 24;
        }
        if (days < 0) {
            months--;
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        const totalMonths = years * 12 + months;

        render([
            {value: totalMonths, label: getPlural(totalMonths, 'месяц', 'месяца', 'месяцев')},
            {value: days, label: getPlural(days, 'день', 'дня', 'дней')},
            {value: hours, label: getPlural(hours, 'час', 'часа', 'часов')},
            {value: minutes, label: getPlural(minutes, 'минута', 'минуты', 'минут')},
            {value: seconds, label: getPlural(seconds, 'секунда', 'секунды', 'секунд')}
        ]);
    }

    // ================== ДНИ: 365 → 1 ==================
    const dayCells = [];
    let lastDayIdx = null;

    function buildDays() {
        const grid = document.getElementById('days-grid');

        for (let i = 0; i < TOTAL_DAYS; i++) {
            const d = new Date(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate() + i);

            const cell = document.createElement('div');
            cell.className = 'dcell';
            cell.textContent = TOTAL_DAYS - i;
            cell.title = d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long', year: 'numeric'});

            grid.appendChild(cell);
            dayCells.push(cell);
        }
    }

    // Подбирает размер клеток: на большом экране все 365 помещаются без прокрутки,
    // на телефоне клетки не мельче 34px, и сетка прокручивается
    function fitDays() {
        const wrap = document.getElementById('days-wrap');
        const grid = document.getElementById('days-grid');
        const w = wrap.clientWidth;
        const h = wrap.clientHeight;
        if (!w || !h) return;

        const gap = 3;
        const MAX = 56;
        const MIN = w > 600 ? 24 : 34;

        let size = MIN;
        for (let s = MAX; s >= MIN; s--) {
            const c = Math.floor((w + gap) / (s + gap));
            const r = Math.floor((h + gap) / (s + gap));
            if (c * r >= TOTAL_DAYS) {
                size = s;
                break;
            }
        }

        const cols = Math.max(1, Math.floor((w + gap) / (size + gap)));
        grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
        grid.style.gridAutoRows = size + 'px';
        grid.style.fontSize = Math.max(9, Math.round(size * 0.38)) + 'px';
    }

    function scrollToToday() {
        if (lastDayIdx === null) return;
        const wrap = document.getElementById('days-wrap');
        const cell = dayCells[Math.max(0, Math.min(TOTAL_DAYS - 1, lastDayIdx))];
        wrap.scrollTop = Math.max(0, cell.offsetTop - wrap.clientHeight / 2 + cell.offsetHeight / 2);
    }

    // Номер сегодняшнего дня службы: 0 = 28.10.2026
    function getDayIndex(now) {
        const a = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
        const b = Date.UTC(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate());
        return Math.round((a - b) / 86400000);
    }

    function updateDays(now) {
        const idx = getDayIndex(now);
        if (idx === lastDayIdx) return;   // обновляем только при смене дня (в 00:00)
        lastDayIdx = idx;

        dayCells.forEach((cell, i) => {
            cell.classList.toggle('passed', i < idx);
            cell.classList.toggle('today', i === idx);
        });

        const done = Math.max(0, Math.min(TOTAL_DAYS, idx));
        document.getElementById('days-done').textContent = done;
        document.getElementById('days-left').textContent = TOTAL_DAYS - done;
        document.getElementById('days-bar-fill').style.width = (done / TOTAL_DAYS * 100) + '%';

        if (document.getElementById('view-days').classList.contains('active')) {
            scrollToToday();
        }
    }

    buildDays();
    new ResizeObserver(fitDays).observe(document.getElementById('days-wrap'));

    // ================== СЕЗОНЫ ==================
    const SEASONS = ['winter', 'spring', 'summer', 'autumn'];

    function getSeason(d) {
        const m = d.getMonth();
        if (m === 11 || m <= 1) return 'winter';
        if (m <= 4) return 'spring';
        if (m <= 7) return 'summer';
        return 'autumn';
    }

    const forced = params.get('season');
    const season = SEASONS.includes(forced) ? forced : getSeason(getNow());

    document.body.classList.add(season);

    // ================== АНИМАЦИЯ ==================
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, particles = [];

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    const LEAF_COLORS = ['#dc2626', '#ea580c', '#f59e0b', '#eab308', '#b45309', '#9a3412'];
    const PETAL_COLORS = ['#fbcfe8', '#f9a8d4', '#fce7f3', '#f472b6'];

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initParticles();
    }

    function createParticle(initial) {
        const p = {
            x: rand(0, W),
            y: initial ? rand(0, H) : rand(-30, -5),
            phase: rand(0, Math.PI * 2)
        };
        switch (season) {
            case 'winter':
                p.r = rand(1.5, 4.5);
                p.vy = rand(0.5, 1.4) + p.r * 0.15;
                p.sway = rand(0.3, 1);
                p.alpha = rand(0.5, 0.95);
                break;
            case 'autumn':
                p.s = rand(7, 14);
                p.vy = rand(0.7, 1.6);
                p.sway = rand(0.8, 1.8);
                p.rot = rand(0, Math.PI * 2);
                p.vr = rand(-0.03, 0.03);
                p.color = pick(LEAF_COLORS);
                break;
            case 'spring':
                p.s = rand(4, 8);
                p.vy = rand(0.5, 1.2);
                p.sway = rand(0.6, 1.4);
                p.drift = rand(0.2, 0.8);
                p.rot = rand(0, Math.PI * 2);
                p.vr = rand(-0.04, 0.04);
                p.color = pick(PETAL_COLORS);
                break;
            case 'summer':
                p.y = initial ? rand(0, H) : H + 10;
                p.r = rand(1, 2.6);
                p.vy = -rand(0.15, 0.5);
                p.sway = rand(0.2, 0.6);
                p.alpha = rand(0.3, 0.8);
                break;
        }
        return p;
    }

    function initParticles() {
        const area = W * H;
        const counts = {winter: 9000, autumn: 22000, spring: 18000, summer: 20000};
        const n = Math.min(160, Math.round(area / counts[season]));
        particles = Array.from({length: n}, () => createParticle(true));
    }

    function drawSun(t) {
        const cx = W * 0.82, cy = H * 0.17;
        const R = Math.max(36, Math.min(64, Math.min(W, H) * 0.08));

        const glow = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 5);
        glow.addColorStop(0, 'rgba(255, 240, 150, 0.55)');
        glow.addColorStop(1, 'rgba(255, 240, 150, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.00015);
        ctx.fillStyle = 'rgba(255, 235, 140, 0.55)';
        const rays = 16;
        for (let i = 0; i < rays; i++) {
            ctx.rotate((Math.PI * 2) / rays);
            const len = R * (i % 2 ? 1.9 : 2.4);
            ctx.beginPath();
            ctx.moveTo(-R * 0.14, R * 1.2);
            ctx.lineTo(0, R * 1.2 + len * 0.6);
            ctx.lineTo(R * 0.14, R * 1.2);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        const disc = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.2, cx, cy, R);
        disc.addColorStop(0, '#fffbe0');
        disc.addColorStop(1, '#fcd34d');
        ctx.fillStyle = disc;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawLeaf(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.quadraticCurveTo(p.s * 0.9, 0, 0, p.s);
        ctx.quadraticCurveTo(-p.s * 0.9, 0, 0, -p.s);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.lineTo(0, p.s + 3);
        ctx.stroke();
        ctx.restore();
    }

    function drawPetal(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function frame(t) {
        ctx.clearRect(0, 0, W, H);
        if (season === 'summer') drawSun(t);

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.phase += 0.015;
            p.x += Math.sin(p.phase) * p.sway + (p.drift || 0);
            p.y += p.vy;
            if (p.vr) p.rot += p.vr;

            if (season === 'winter') {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (season === 'autumn') {
                drawLeaf(p);
            } else if (season === 'spring') {
                drawPetal(p);
            } else {
                ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.phase * 2));
                ctx.fillStyle = '#fff6b0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            const out = season === 'summer' ? p.y < -10 : p.y > H + 20;
            if (out || p.x > W + 30 || p.x < -30) {
                particles[i] = createParticle(false);
            }
        }
        requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);

    setInterval(updateCounter, 1000);
    updateCounter();
</script>
</body>
</html>
