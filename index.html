<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отсчет до дембеля</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg1: #0b1730;
            --bg2: #1e3a5f;
            --accent: #7dd3fc;
            --gap: 24px;
        }

        body.winter {
            --bg1: #0b1730;
            --bg2: #25507a;
            --accent: #7dd3fc;
        }

        body.spring {
            --bg1: #1c3b33;
            --bg2: #4f8a68;
            --accent: #f9a8d4;
        }

        body.summer {
            --bg1: #0284c7;
            --bg2: #fbbf24;
            --accent: #fde047;
        }

        body.autumn {
            --bg1: #2e1508;
            --bg2: #b45309;
            --accent: #fdba74;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(160deg, var(--bg1), var(--bg2));
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 16px;
        }

        #scene {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(440px, 100%);
            height: 300px;
            max-height: 100%;
            padding: 28px 24px;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--gap);
        }

        h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        .badge-home {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            visibility: hidden;
        }

        .badge-home::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(0.7);
            }
        }

        .badge-home.show {
            visibility: visible;
        }

        .counter {
            display: flex;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .unit {
            flex: 1 1 0;
            min-width: 0;
            max-width: 78px;
            padding: 14px 0 10px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .unit .num {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .unit .lbl {
            margin-top: 6px;
            font-size: 0.66rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .unit.done {
            max-width: 260px;
            padding: 16px 0;
        }

        .unit.done .num {
            font-size: 2.4rem;
            color: #4ade80;
        }

        .subtext {
            width: 100%;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: var(--gap);
        }
    </style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="container">
    <div id="home-badge" class="badge-home">Служба еще не началась</div>
    <h1>До дембеля осталось</h1>

    <div id="counter" class="counter"></div>

    <div class="subtext">Дата дембеля (предположительная): 28.10.2027</div>
</div>

<script>
    // ================== СЧЕТЧИК ==================
    const targetDate = new Date(2027, 9, 28, 0, 0, 0);
    const checkDate = new Date(2026, 9, 28, 0, 0, 0);

    function getPlural(number, one, two, five) {
        let n = Math.abs(number);
        n %= 100;
        if (n >= 5 && n <= 20) return five;
        n %= 10;
        if (n === 1) return one;
        if (n >= 2 && n <= 4) return two;
        return five;
    }

    function render(units) {
        document.getElementById('counter').innerHTML = units.map(u =>
            `<div class="unit"><div class="num">${u.value}</div><div class="lbl">${u.label}</div></div>`
        ).join('');
    }

    function updateCounter() {
        const now = new Date();
        document.getElementById('home-badge').classList.toggle('show', now < checkDate);

        if (now >= targetDate) {
            document.getElementById('counter').innerHTML =
                `<div class="unit done"><div class="num">Дембель!</div></div>`;
            return;
        }

        let years = targetDate.getFullYear() - now.getFullYear();
        let months = targetDate.getMonth() - now.getMonth();
        let days = targetDate.getDate() - now.getDate();
        let hours = targetDate.getHours() - now.getHours();
        let minutes = targetDate.getMinutes() - now.getMinutes();
        let seconds = targetDate.getSeconds() - now.getSeconds();

        if (seconds < 0) {
            minutes--;
            seconds += 60;
        }
        if (minutes < 0) {
            hours--;
            minutes += 60;
        }
        if (hours < 0) {
            days--;
            hours += 24;
        }
        if (days < 0) {
            months--;
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        const totalMonths = years * 12 + months;

        render([
            {value: totalMonths, label: getPlural(totalMonths, 'месяц', 'месяца', 'месяцев')},
            {value: days, label: getPlural(days, 'день', 'дня', 'дней')},
            {value: minutes, label: getPlural(minutes, 'минута', 'минуты', 'минут')},
            {value: seconds, label: getPlural(seconds, 'секунда', 'секунды', 'секунд')}
        ]);
    }

    // ================== СЕЗОНЫ ==================
    const SEASONS = ['winter', 'spring', 'summer', 'autumn'];

    function getSeason(d) {
        const m = d.getMonth();

        if (m === 11 || m <= 1) {
            return 'winter';
        }
        if (m <= 4) {
            return 'spring';
        }
        if (m <= 7) {
            return 'summer';
        }

        return 'autumn';
    }

    // ?season=winter|spring|summer|autumn — для проверки
    const forced = new URLSearchParams(location.search).get('season');
    const season = SEASONS.includes(forced) ? forced : getSeason(new Date());

    document.body.classList.add(season);

    // ================== АНИМАЦИЯ ==================
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, particles = [];

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    const LEAF_COLORS = ['#dc2626', '#ea580c', '#f59e0b', '#eab308', '#b45309', '#9a3412'];
    const PETAL_COLORS = ['#fbcfe8', '#f9a8d4', '#fce7f3', '#f472b6'];

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initParticles();
    }

    function createParticle(initial) {
        const p = {
            x: rand(0, W),
            y: initial ? rand(0, H) : rand(-30, -5),
            phase: rand(0, Math.PI * 2)
        };
        switch (season) {
            case 'winter':
                p.r = rand(1.5, 4.5);
                p.vy = rand(0.5, 1.4) + p.r * 0.15;
                p.sway = rand(0.3, 1);
                p.alpha = rand(0.5, 0.95);
                break;
            case 'autumn':
                p.s = rand(7, 14);
                p.vy = rand(0.7, 1.6);
                p.sway = rand(0.8, 1.8);
                p.rot = rand(0, Math.PI * 2);
                p.vr = rand(-0.03, 0.03);
                p.color = pick(LEAF_COLORS);
                break;
            case 'spring':
                p.s = rand(4, 8);
                p.vy = rand(0.5, 1.2);
                p.sway = rand(0.6, 1.4);
                p.drift = rand(0.2, 0.8);
                p.rot = rand(0, Math.PI * 2);
                p.vr = rand(-0.04, 0.04);
                p.color = pick(PETAL_COLORS);
                break;
            case 'summer':
                p.y = initial ? rand(0, H) : H + 10;
                p.r = rand(1, 2.6);
                p.vy = -rand(0.15, 0.5);
                p.sway = rand(0.2, 0.6);
                p.alpha = rand(0.3, 0.8);
                break;
        }
        return p;
    }

    function initParticles() {
        const area = W * H;
        const counts = {winter: 9000, autumn: 22000, spring: 18000, summer: 20000};
        const n = Math.min(160, Math.round(area / counts[season]));
        particles = Array.from({length: n}, () => createParticle(true));
    }

    function drawSun(t) {
        const cx = W * 0.82, cy = H * 0.17;
        const R = Math.max(36, Math.min(64, Math.min(W, H) * 0.08));

        // свечение
        const glow = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 5);
        glow.addColorStop(0, 'rgba(255, 240, 150, 0.55)');
        glow.addColorStop(1, 'rgba(255, 240, 150, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 5, 0, Math.PI * 2);
        ctx.fill();

        // лучи
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.00015);
        ctx.fillStyle = 'rgba(255, 235, 140, 0.55)';
        const rays = 16;
        for (let i = 0; i < rays; i++) {
            ctx.rotate((Math.PI * 2) / rays);
            const len = R * (i % 2 ? 1.9 : 2.4);
            ctx.beginPath();
            ctx.moveTo(-R * 0.14, R * 1.2);
            ctx.lineTo(0, R * 1.2 + len * 0.6);
            ctx.lineTo(R * 0.14, R * 1.2);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();

        // диск
        const disc = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.2, cx, cy, R);
        disc.addColorStop(0, '#fffbe0');
        disc.addColorStop(1, '#fcd34d');
        ctx.fillStyle = disc;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawLeaf(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.quadraticCurveTo(p.s * 0.9, 0, 0, p.s);
        ctx.quadraticCurveTo(-p.s * 0.9, 0, 0, -p.s);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -p.s);
        ctx.lineTo(0, p.s + 3);
        ctx.stroke();
        ctx.restore();
    }

    function drawPetal(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function frame(t) {
        ctx.clearRect(0, 0, W, H);

        if (season === 'summer') drawSun(t);

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.phase += 0.015;
            p.x += Math.sin(p.phase) * p.sway + (p.drift || 0);
            p.y += p.vy;
            if (p.vr) p.rot += p.vr;

            if (season === 'winter') {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            } else if (season === 'autumn') {
                drawLeaf(p);
            } else if (season === 'spring') {
                drawPetal(p);
            } else {
                ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.phase * 2));
                ctx.fillStyle = '#fff6b0';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            const out = season === 'summer' ? p.y < -10 : p.y > H + 20;
            if (out || p.x > W + 30 || p.x < -30) {
                particles[i] = createParticle(false);
            }
        }
        requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);

    setInterval(updateCounter, 1000);
    updateCounter();
</script>
</body>
</html>
